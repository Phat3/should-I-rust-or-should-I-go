
version: '3.2'
services:
  should_i_rust_or_should_i_go:
    build: ./
    volumes:
      - type: bind
        source: ./service/ro
        target: /home/chall/service/ro
        read_only: true
      - type: bind
        source: ./service/rw
        target: /home/chall/service/rw
      - type: bind
        source: ./service/root_owned
        target: /home/chall/service/root_owned
    ports:
      - "6666:6666"
