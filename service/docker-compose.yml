
version: '3.2'
services:
  should_i_rust_or_should_i_go:
    build: ./
    volumes:
      - type: bind
        source: ./service/ro
        target: /root/service/ro
        read_only: true
      - type: bind
        source: ./service/rw
        target: /root/service/rw
    ports:
      - "6666:6666"